<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复利计算器 · Compound Interest Calculator</title>
<style>
/* ============ 主题变量：浅色 / 深色 ============ */
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --sub:#86868b;
  --faint:#aeaeb2; --line:#e8e8ed; --entry:#fafafc; --entry-border:#dcdce1;
  --blue:#0a7cff; --green:#1f9d55; --orange:#c26a1f;
  --area:#dcebfb; --grid:#ececf1; --track:#e9e9ee; --shadow:rgba(0,0,0,.05);
}
[data-theme="dark"]{
  --bg:#1c1c1e; --card:#2c2c2e; --ink:#f5f5f7; --sub:#98989f;
  --faint:#6c6c70; --line:#3a3a3c; --entry:#3a3a3c; --entry-border:#48484a;
  --blue:#409cff; --green:#30d158; --orange:#ff9f0a;
  --area:#1e3a5f; --grid:#3a3a3c; --track:#48484a; --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,"SF Pro Display","SF Pro Text","Microsoft YaHei UI",
             "Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; padding:34px 28px 26px;
  transition:background .25s,color .25s;
}
.wrap{max-width:1100px;margin:0 auto}

/* ============ 顶部标题行 ============ */
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
h1{font-size:28px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.subtitle{color:var(--sub);font-size:13px;margin-top:5px;font-weight:500}

/* 深色 / 浅色分段开关 */
.seg{display:flex;background:var(--track);border-radius:10px;padding:3px;gap:3px}
.seg button{
  border:0;background:transparent;color:var(--sub);font-size:13px;font-weight:600;
  padding:7px 15px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:5px;
  font-family:inherit;transition:all .2s;
}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 1px 4px rgba(10,124,255,.35)}

/* ============ 两列布局 ============ */
.grid{display:grid;grid-template-columns:505px 1fr;gap:18px;align-items:start}
.col-left{display:flex;flex-direction:column;gap:16px}
.card{
  background:var(--card);border-radius:18px;padding:26px 26px 24px;
  box-shadow:0 1px 3px var(--shadow);transition:background .25s;
}
.card h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}

/* ============ 输入区 ============ */
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:20px 22px;margin:18px 0 24px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:9px}
.field input{
  width:100%;height:46px;border:1px solid var(--entry-border);background:var(--entry);
  color:var(--ink);border-radius:11px;padding:0 15px;font-size:16px;font-family:inherit;
  outline:none;transition:border-color .15s,box-shadow .15s,background .25s;
}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,124,255,.16)}

.buttons{display:flex;gap:16px}
.btn{
  flex:1;height:52px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:transform .08s,filter .15s,background .25s,border-color .25s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);border:1px solid var(--blue);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border:1px solid var(--entry-border);color:var(--sub)}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink)}

/* ============ 结果区 ============ */
.result-label{color:var(--sub);font-size:13px;font-weight:600}
.result-hero{color:var(--blue);font-size:42px;font-weight:800;margin:12px 0 16px;
  font-variant-numeric:tabular-nums;letter-spacing:.5px}
.divider{height:1px;background:var(--line);margin-bottom:18px}
.stats{display:flex;gap:12px}
.stat{flex:1}
.stat .k{color:var(--sub);font-size:13px;margin-bottom:7px}
.stat .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.v.green{color:var(--green)} .v.orange{color:var(--orange)} .v.blue{color:var(--blue)}

/* ============ 图表卡片 ============ */
.chart-card{min-height:556px;display:flex;flex-direction:column}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chart-head .tip{color:var(--sub);font-size:12px}
svg{width:100%;flex:1}

.footer{text-align:center;color:var(--faint);font-size:12px;margin-top:20px}

@media (max-width:980px){
  .grid{grid-template-columns:1fr}
  .chart-card{min-height:420px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 顶部：标题 + 主题切换 -->
  <div class="header">
    <div>
      <h1>💰 复利计算器</h1>
      <div class="subtitle">Compound Interest Calculator</div>
    </div>
    <div class="seg" role="tablist">
      <button id="btnDark" onclick="setTheme('dark')">🌙 深色</button>
      <button id="btnLight" onclick="setTheme('light')">☀️ 浅色</button>
    </div>
  </div>

  <div class="grid">
    <!-- 左列 -->
    <div class="col-left">

      <!-- 输入卡片 -->
      <div class="card">
        <div class="inputs">
          <div class="field">
            <label for="inP">初始本金（元）</label>
            <input id="inP" type="number" min="0" value="10000">
          </div>
          <div class="field">
            <label for="inR">每期利率（%）</label>
            <input id="inR" type="number" step="0.01" value="3">
          </div>
          <div class="field">
            <label for="inN">周期数量（期）</label>
            <input id="inN" type="number" min="0" step="1" value="10">
          </div>
          <div class="field">
            <label for="inAdd">每期追加投入（元）</label>
            <input id="inAdd" type="number" min="0" value="500">
          </div>
        </div>
        <div class="buttons">
          <button class="btn btn-primary" onclick="compute()">计 算</button>
          <button class="btn btn-ghost" onclick="resetDefaults()">重 置</button>
        </div>
      </div>

      <!-- 结果卡片 -->
      <div class="card">
        <div class="result-label">到期总额（连本带利）</div>
        <div class="result-hero" id="total">￥ 0.00</div>
        <div class="divider"></div>
        <div class="stats">
          <div class="stat"><div class="k">总利息</div><div class="v green" id="interest">￥ 0.00</div></div>
          <div class="stat"><div class="k">本金合计</div><div class="v orange" id="principalSum">￥ 0.00</div></div>
          <div class="stat"><div class="k">收益倍数</div><div class="v blue" id="multiple">0.00 ×</div></div>
        </div>
      </div>
    </div>

    <!-- 右列：增长曲线 -->
    <div class="card chart-card">
      <div class="chart-head">
        <h2>📈 增长曲线</h2>
        <span class="tip">蓝色为复利总值 · 虚线为本金合计</span>
      </div>
      <svg id="chart" viewBox="0 0 545 470" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>

  <div class="footer">追加投入按每期期末计入 · 输入即自动计算 · 关闭浏览器标签页即可退出</div>
</div>

<script>
/* ============ 基础工具 ============ */
const $ = id => document.getElementById(id);
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function num(id){ const v = parseFloat($(id).value); return isNaN(v) ? 0 : v; }
function money(v){
  return v.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
/* 漂亮步长：取 1 / 2 / 5 × 10^k */
function niceStep(raw){
  if(raw <= 0) return 1;
  const base = Math.pow(10, Math.floor(Math.log10(raw)));
  for(const m of [1, 2, 5, 10]) if(base * m >= raw) return base * m;
  return base * 10;
}

/* ============ 主题切换 ============ */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $('btnDark').classList.toggle('on', t === 'dark');
  $('btnLight').classList.toggle('on', t === 'light');
  try{ localStorage.setItem('ci-theme', t); }catch(e){}
  compute();   // 主题色变化后重绘图表
}

/* ============ 计算：每期 余额=余额×(1+利率)+追加投入（期末计入） ============ */
function compute(){
  const p   = Math.max(num('inP'), 0);
  const r   = num('inR') / 100;
  const n   = Math.min(Math.max(Math.round(num('inN')), 0), 500);
  const add = Math.max(num('inAdd'), 0);

  const totals = [p], principals = [p];
  let bal = p;
  for(let i = 0; i < n; i++){
    bal = bal * (1 + r) + add;
    totals.push(bal);
    principals.push(p + add * (i + 1));
  }

  const total    = totals[n];
  const prinSum  = principals[n];
  const interest = total - prinSum;
  const multiple = prinSum > 0 ? total / prinSum : 0;

  $('total').textContent       = '￥ ' + money(total);
  $('interest').textContent    = '￥ ' + money(interest);
  $('principalSum').textContent = '￥ ' + money(prinSum);
  $('multiple').textContent    = multiple.toFixed(2) + ' ×';

  drawChart(totals, principals);
}

function resetDefaults(){
  $('inP').value = 10000; $('inR').value = 3;
  $('inN').value = 10;    $('inAdd').value = 500;
  compute();
}

/* ============ SVG 增长曲线 ============ */
function drawChart(totals, principals){
  const W = 545, H = 470, L = 66, R = 26, T = 66, B = 52;
  const pw = W - L - R, ph = H - T - B;
  const n = totals.length - 1;

  const yLo = Math.min(...totals, ...principals);
  let  yHi = Math.max(...totals, ...principals);
  if(yHi <= yLo) yHi = yLo + 1;

  const step = niceStep((yHi - yLo) / 5);
  const ticks = [];
  for(let v = yLo; v <= yHi + 1e-9; v += step) ticks.push(v);
  if(ticks.length < 2) ticks.push(yLo + step);
  const yMin = yLo;
  const yMax = Math.max(ticks[ticks.length - 1] + step * 0.7, yHi * 1.02);

  const X = i => n ? L + pw * i / n : L;
  const Y = v => T + ph - ph * (v - yMin) / (yMax - yMin);

  const blue = cssVar('--blue'), orange = cssVar('--orange');
  const area = cssVar('--area'), grid = cssVar('--grid');
  const ink = cssVar('--ink'), sub = cssVar('--sub');

  let s = '';

  /* 图例 */
  s += `<line x1="${L}" y1="28" x2="${L+34}" y2="28" stroke="${blue}" stroke-width="3" stroke-linecap="round"/>`;
  s += `<text x="${L+42}" y="32" fill="${ink}" font-size="13" font-weight="600">复利总值</text>`;
  s += `<line x1="${L+150}" y1="28" x2="${L+184}" y2="28" stroke="${orange}" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round"/>`;
  s += `<text x="${L+192}" y="32" fill="${ink}" font-size="13" font-weight="600">本金合计</text>`;

  /* 横向网格线 + Y 轴标签（万） */
  for(const v of ticks){
    const y = Y(v);
    s += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${grid}"/>`;
    s += `<text x="${L-12}" y="${y+4}" text-anchor="end" fill="${sub}" font-size="12">${(v/10000).toFixed(1)}万</text>`;
  }

  /* X 轴刻度（0 ~ n，约 6 个） */
  const xStep = Math.max(1, Math.floor(n / 5) || 1);
  const xTicks = [];
  for(let i = 0; i <= n; i += xStep) xTicks.push(i);
  if(xTicks[xTicks.length - 1] !== n) xTicks.push(n);
  for(const i of xTicks){
    s += `<text x="${X(i)}" y="${T+ph+22}" text-anchor="middle" fill="${sub}" font-size="12">${i}</text>`;
  }
  s += `<text x="${L + pw/2}" y="${H-8}" text-anchor="middle" fill="${sub}" font-size="13">期数</text>`;

  /* 面积填充：复利总值曲线下方 */
  let areaPath = `M ${X(0)} ${Y(totals[0])}`;
  for(let i = 1; i <= n; i++) areaPath += ` L ${X(i)} ${Y(totals[i])}`;
  areaPath += ` L ${X(n)} ${T+ph} L ${X(0)} ${T+ph} Z`;
  s += `<path d="${areaPath}" fill="${area}" opacity="0.85"/>`;

  /* 本金合计虚线 */
  let pPath = '';
  for(let i = 0; i <= n; i++) pPath += `${i ? 'L' : 'M'} ${X(i)} ${Y(principals[i])} `;
  s += `<path d="${pPath}" fill="none" stroke="${orange}" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round"/>`;

  /* 复利总值蓝色折线 */
  let tPath = '';
  for(let i = 0; i <= n; i++) tPath += `${i ? 'L' : 'M'} ${X(i)} ${Y(totals[i])} `;
  s += `<path d="${tPath}" fill="none" stroke="${blue}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;

  $('chart').innerHTML = s;
}

/* ============ 绑定输入事件 + 初始化 ============ */
['inP','inR','inN','inAdd'].forEach(id =>
  $(id).addEventListener('input', compute)
);
let savedTheme = 'light';
try{ savedTheme = localStorage.getItem('ci-theme') || 'light'; }catch(e){}
setTheme(savedTheme);
</script>
</body>
</html>
